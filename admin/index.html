<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Edit konten website</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&display=swap">
<style>
  :root {
    --bg: #fcfaf6; --card: #ffffff; --ink: #1f150f; --ink-70: rgba(31,21,15,.7); --ink-60: rgba(31,21,15,.6); --ink-40: rgba(31,21,15,.4);
    --line: #e6dccd; --line-soft: #efe6d9; --maroon: #370101; --maroon-hover: #5a1a1a; --danger: #b42318; --warn: #fff4d6;
    --sans: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif; color-scheme: light;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--sans); letter-spacing: -0.01em; -webkit-font-smoothing: antialiased; }
  [hidden] { display: none !important; }
  button, input, textarea, select { font: inherit; color: inherit; letter-spacing: inherit; }

  /* Login */
  .login { min-height: 100%; display: grid; place-items: center; padding: 24px max(16px, env(safe-area-inset-left, 0px)); }
  .login-card { width: min(380px, 100%); background: var(--card); border: 1px solid var(--line-soft); border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 12px 40px rgba(55,1,1,.06); }
  .login-card h1 { margin: 0; font-size: 20px; font-weight: 500; }
  .login-card p { margin: 0; color: var(--ink-60); }

  /* Layout: live preview on the left, editor on the right */
  .app { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 480px; }
  .preview { background: #e9e3d9; padding: 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .preview-bar { display: flex; align-items: center; gap: 10px; color: var(--ink-60); font-size: 13px; }
  .preview-bar a { color: var(--maroon); }
  .preview iframe { flex: 1; width: 100%; border: 0; border-radius: 14px; background: var(--bg); box-shadow: 0 8px 30px rgba(31,21,15,.12); }
  .panel { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: #fbf8f2; border-left: 1px solid var(--line-soft); }
  @media (max-width: 920px) { .app { grid-template-columns: 1fr; } .preview { display: none; } }

  .head, .foot { display: flex; align-items: center; gap: 8px; padding: 14px 18px; background: #fff; }
  .head { border-bottom: 1px solid var(--line-soft); padding-top: calc(14px + env(safe-area-inset-top, 0px)); }
  .foot { border-top: 1px solid var(--line-soft); padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); }
  .head h2 { flex: 1; margin: 0; font-size: 16px; font-weight: 500; }
  .status { flex: 1; min-width: 0; font-size: 13px; color: var(--ink-60); }
  .status.err { color: var(--danger); }
  .status.ok { color: #1a7f37; }
  .body { flex: 1; overflow-y: auto; padding: 12px 18px 28px; display: flex; flex-direction: column; gap: 10px; overscroll-behavior: contain; }
  .note { padding: 10px 12px; border-radius: 12px; background: var(--warn); font-size: 13px; }

  details { background: #fff; border-radius: 16px; border: 1px solid var(--line-soft); }
  summary { padding: 14px 16px; font-weight: 500; cursor: pointer; list-style: none; display: flex; justify-content: space-between; }
  summary::after { content: "+"; color: var(--ink-40); }
  details[open] summary::after { content: "–"; }
  summary::-webkit-details-marker { display: none; }
  .sec { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 12px; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--ink-60); }
  .bi { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .bi > div { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .lbl { font-size: 12px; color: var(--ink-60); }
  .tag { display: inline-block; margin-right: 4px; padding: 0 6px; border-radius: 6px; background: #f3eee5; font-size: 10px; font-weight: 500; color: var(--ink-70); }
  .hint { font-size: 12px; color: var(--ink-60); line-height: 1.45; }
  input[type="text"], input[type="url"], input[type="email"], input[type="password"], textarea, select {
    width: 100%; min-width: 0; padding: 9px 11px; border: 1px solid var(--line); border-radius: 10px; background: #fff; line-height: 1.4;
  }
  textarea { resize: vertical; min-height: 84px; }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--maroon); outline-offset: -1px; border-color: transparent; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 14px; border-radius: 999px; border: 1px solid var(--line); background: #fff; font-weight: 500; font-size: 13px; cursor: pointer; white-space: nowrap; }
  .btn:hover { background: #f6f1e8; }
  .btn.primary { background: var(--maroon); border-color: var(--maroon); color: #fff; }
  .btn.primary:hover { background: var(--maroon-hover); }
  .btn.danger { color: var(--danger); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.icon { width: 34px; height: 34px; padding: 0; }
  .item { border: 1px solid var(--line-soft); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 10px; background: #fdfbf7; }
  .item-head { display: flex; align-items: center; gap: 6px; }
  .ibadge { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; flex: none; transition: background .25s; }
  .ibadge svg { width: 18px; height: 18px; fill: none; stroke: var(--ink); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .autorow { flex-direction: row; align-items: center; gap: 8px; font-size: 12.5px; cursor: pointer; }
  .autorow input { width: 16px; height: 16px; accent-color: var(--maroon); margin: 0; }
  .item-head b { flex: 1; min-width: 0; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; }
  .row > label { flex: 1; min-width: 120px; }
  .swatches { display: flex; flex-wrap: wrap; gap: 6px; }
  .swatch { width: 26px; height: 26px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); }
  .swatch[aria-pressed="true"] { border-color: var(--ink); }
  .photos { display: flex; flex-wrap: wrap; gap: 8px; }
  .thumb { position: relative; width: 64px; height: 64px; border-radius: 10px; overflow: hidden; background: #f3eee5; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb button { position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; border: 0; border-radius: 50%; background: rgba(31,21,15,.7); color: #fff; font-size: 12px; line-height: 20px; cursor: pointer; }
  .add-photo { width: 64px; height: 64px; border-radius: 10px; border: 1.5px dashed #d8ccba; background: transparent; color: var(--ink-60); font-size: 22px; cursor: pointer; }
  .add-photo:disabled { cursor: default; opacity: .5; }
  .profile { display: flex; align-items: center; gap: 12px; }
  .profile img { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; background: #f3eee5; }
  .chip-row { display: grid; grid-template-columns: 1fr 1fr auto auto; gap: 6px; align-items: center; }
  .chip-dot { width: 26px; height: 26px; border-radius: 50%; border: 0; cursor: pointer; box-shadow: inset 0 0 0 1px rgba(0,0,0,.1); }
  @media (max-width: 560px) { .bi { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div class="login" id="login">
  <form class="login-card" id="login-form">
    <h1>Edit konten website</h1>
    <p>Masukkan kata sandi untuk mulai mengedit.</p>
    <label>Kata sandi<input type="password" id="pw" autocomplete="current-password" autofocus required></label>
    <p class="status err" id="login-err" hidden></p>
    <button class="btn primary" id="login-btn" type="submit">Masuk</button>
  </form>
</div>

<div class="app" id="app" hidden>
  <section class="preview" aria-label="Pratinjau">
    <div class="preview-bar"><span>Pratinjau langsung, berubah saat kamu mengetik.</span><a href="/" target="_blank" rel="noopener">Buka website</a></div>
    <iframe id="pv" src="/" title="Pratinjau website"></iframe>
  </section>
  <aside class="panel" aria-label="Edit konten">
    <div class="head"><h2>Edit konten</h2><button class="btn" id="logout" type="button">Keluar</button></div>
    <div class="body" id="body"></div>
    <div class="foot"><span class="status" id="status">Tidak ada perubahan.</span><button class="btn primary" id="save" type="button" disabled>Simpan</button></div>
  </aside>
</div>

<script>
(() => {
  "use strict";
  const PALETTE = ["#fde047", "#fb923c", "#d9f99d", "#bfdbfe", "#ddd6fe", "#fbcfe8", "#6ee7b7", "#f1f1f1"];
  const ICON_NAMES = { cap: "Topi wisuda", megaphone: "Pengeras suara", book: "Buku", people: "Orang", clipboard: "Papan catatan",
    star: "Bintang", heart: "Hati", mic: "Mikrofon", palette: "Palet warna", briefcase: "Tas kerja",
    trophy: "Piala", laptop: "Laptop", camera: "Kamera", music: "Musik", globe: "Bola dunia",
    flask: "Labu sains", pencil: "Pensil", calendar: "Kalender", building: "Gedung", chart: "Grafik" };
  /*ICONS*/const ICONS = {
  cap: '<path d="M2 9.5 12 5l10 4.5L12 14z"/><path d="M6 11.5V16c0 1.4 2.7 3 6 3s6-1.6 6-3v-4.5"/><path d="M22 9.5V15"/>',
  megaphone: '<path d="M3 10.5v3a1 1 0 0 0 1 1h3l6 4.5v-14L7 9.5H4a1 1 0 0 0-1 1z"/><path d="M16.5 9a4 4 0 0 1 0 6"/><path d="M19.5 6.5a8 8 0 0 1 0 11"/>',
  book: '<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5V5.5"/><path d="M20 18v3H6.5"/><path d="M9 8h7"/>',
  people: '<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.1c2.8.4 5 2.8 5 5.9"/>',
  clipboard: '<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V2.8h6V4"/><path d="M9 10h6M9 14h6M9 18h3"/>',
  star: '<path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/>',
  heart: '<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>',
  mic: '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/>',
  palette: '<path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.6-.8 1.3-1.7-.4-1.2.4-2.3 1.7-2.3H17a4 4 0 0 0 4-4c0-5.5-4-10-9-10z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10.5" cy="7" r="1"/><circle cx="15" cy="7.5" r="1"/>',
  briefcase: '<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5h6v2"/><path d="M3 12h18"/>',
  trophy: '<path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H5v1.5A3 3 0 0 0 8 10.5"/><path d="M16 6h3v1.5a3 3 0 0 1-3 3"/><path d="M12 13v4"/><path d="M10 17h4v3h-4z"/><path d="M8.5 20h7"/>',
  laptop: '<rect x="5" y="5" width="14" height="10" rx="1.5"/><path d="M3 19h18"/><path d="M9.5 8.5 8 10l1.5 1.5"/><path d="M14.5 8.5 16 10l-1.5 1.5"/>',
  camera: '<path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
  music: '<path d="M9 18V6l10-2v12"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="16" r="2"/>',
  globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.5 2.7 3.7 5.7 3.7 9S14.5 18.3 12 21c-2.5-2.7-3.7-5.7-3.7-9S9.5 5.7 12 3z"/>',
  flask: '<path d="M9 3h6"/><path d="M10 3v6L5 18.5A1.5 1.5 0 0 0 6.3 21h11.4a1.5 1.5 0 0 0 1.3-2.5L14 9V3"/><path d="M7.5 15h9"/>',
  pencil: '<path d="M4 20l1-4L16.5 4.5a2 2 0 0 1 3 3L8 19z"/><path d="M14.5 6.5l3 3"/>',
  calendar: '<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16"/><path d="M8 3v4"/><path d="M16 3v4"/>',
  building: '<path d="M5 21V5a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1v16"/><path d="M15 10h3a1 1 0 0 1 1 1v10"/><path d="M3 21h18"/><path d="M9 8h2"/><path d="M9 12h2"/><path d="M9 16h2"/>',
  chart: '<path d="M4 20h16"/><path d="M7 20v-7"/><path d="M12 20V8"/><path d="M17 20v-10"/>'
};/*END*/
  const iconSvg = k => (ICONS[k] ? '<svg viewBox="0 0 24 24" aria-hidden="true">' + ICONS[k] + "</svg>" : "");

  /* ---------- auto icon and color ----------
     A new card gets the icon and palette color that fit what it is about, read from its title, place and
     description in both languages. Title words count most. Picking an icon or color by hand switches
     this off for that card (the box on the card turns it back on). */
  const RULES = [
    ["trophy", 1, /\b(juara|lomba|kompetisi|competition|contest|award|winner|prestasi|penghargaan|champion|medali|medal)/g],
    ["camera", 1, /\b(foto|photo|video|film|sinematograf|cinemat|dokumentasi|documentation|fotografer|videografer)/g],
    ["mic", 1, /\b(podcast|presenter|pembicara|speaker|speaking|siaran|broadcast|radio|host|moderator|mc)\b/g],
    ["music", 1, /\b(tari|dance|musik|music|band|vokal|vocal|paduan|choir|nyanyi|singer|gamelan|orkestra|orchestra)/g],
    ["palette", 1, /\b(teater|theat|drama|seni|arts?\b|design|desain|lukis|paint|kreatif|creative|ilustrasi|illustrat|grafis|graphic)/g],
    ["laptop", 1, /\b(developer|programmer|programming|coding|software|website|aplikasi|application|teknologi|technology|komputer|computer|digital|informatika|engineer|data)/g],
    ["flask", 1, /\b(penelitian|research|riset|laboratori|lab\b|sains|science|kimia|chemi|fisika|physic|biolog|ilmiah|scientific)/g],
    ["chart", 1, /\b(analis|analyst|keuangan|finance|financial|akuntan|account|bisnis|business|sales|penjualan|statistik|statistic|ekonomi|econom)/g],
    ["globe", 1, /\b(internasional|international|exchange|pertukaran|luar negeri|abroad|global|foreign|translator|penerjemah)/g],
    ["building", 1, /\b(perusahaan|company|corporate|kantor|office|instansi|pemerintah|government|kementerian|ministry|bank\b|rumah sakit|hospital|dinas)/g],
    ["heart", 1, /\b(relawan|volunteer|sosial|social work|charity|donasi|donation|kemanusiaan|humanitarian|nirlaba|nonprofit|panti)/g],
    ["megaphone", 1, /\b(humas|public relations|kehumasan|pr|komunikasi|communication|marketing|promosi|promotion|kampanye|campaign|protokol|protocol|media sosial|social media)\b/g],
    ["clipboard", 1.5, /\b(observ|plp|praktik lapangan|pengenalan lapangan|field|administrasi|administra|sekretaris|secretar|laporan|report|checklist|audit)/g],
    ["book", 1, /\b(mengajar|teach|guru|kelas|classroom|sekolah|school|pelajaran|lesson|kurikulum|curriculum|belajar|learning|tutor|dosen|lecturer)/g],
    ["people", 1, /\b(mentor|bimbing|pembina|pendamping|organisasi|organization|organisation|himpunan|komunitas|community|panitia|committee|ketua|koordinator|coordinator|tim|team|leader|kepemimpinan|leadership|ukm|bem)\b/g],
    ["calendar", 1, /\b(event|acara|konferensi|conference|seminar|workshop|festival|webinar|pameran|exhibition)/g],
    ["pencil", 1, /\b(menulis|writing|penulis|writer|editor|jurnal|journalis|konten|content|copywrit|blog|artikel|article|redaksi)/g],
    ["cap", 1, /\b(sarjana|bachelor|magister|master|diploma|gelar|degree|graduat|lulus|skripsi|thesis|s1|s2|s3|doktor|doctor|alumni|beasiswa|scholarship|akademik|academic)\b/g],
    ["briefcase", 0.4, /\b(magang|intern|internship|kerja|job|karyawan|employee|staf|staff|freelance|profesional|professional|pekerjaan)/g]
  ];
  // two colors per icon, both from the site's palette: the second is used when the card above already has the first
  const TINTS = { cap: ["#fde047", "#d9f99d"], trophy: ["#fde047", "#fb923c"], megaphone: ["#fb923c", "#fbcfe8"], mic: ["#fb923c", "#ddd6fe"],
    book: ["#d9f99d", "#6ee7b7"], pencil: ["#d9f99d", "#bfdbfe"], flask: ["#6ee7b7", "#bfdbfe"], globe: ["#6ee7b7", "#bfdbfe"], chart: ["#6ee7b7", "#fde047"],
    people: ["#bfdbfe", "#ddd6fe"], building: ["#bfdbfe", "#f1f1f1"], laptop: ["#bfdbfe", "#ddd6fe"], clipboard: ["#ddd6fe", "#bfdbfe"],
    calendar: ["#ddd6fe", "#fbcfe8"], palette: ["#fbcfe8", "#ddd6fe"], camera: ["#fbcfe8", "#bfdbfe"], music: ["#fbcfe8", "#fde047"],
    heart: ["#fbcfe8", "#fb923c"], star: ["#fde047", "#fbcfe8"], briefcase: ["#f1f1f1", "#bfdbfe"] };
  const bothLangs = o => ((o && o.en) || "") + " " + ((o && o.id) || "");
  function suggest(c, section, list, idx) {
    const parts = [[bothLangs(c.title).toLowerCase(), 3], [bothLangs(c.org).toLowerCase(), 1.2], [bothLangs(c.desc).toLowerCase(), 1]];
    let best = null, top = -1;
    for (const [icon, w, re] of RULES) {
      let score = 0;
      for (const [text, fw] of parts) score += fw * Math.min(2, (text.match(re) || []).length);
      score *= w;
      if (icon === "cap" && section === "edu") score += 3.5;
      if (icon === "briefcase" && section === "exp") score += 0.8;
      if (score > top) { top = score; best = icon; }
    }
    const opts = TINTS[best] || ["#f1f1f1", "#bfdbfe"];
    const above = idx > 0 && list[idx - 1] ? list[idx - 1].tint : null;
    return { icon: best, tint: opts[0] === above ? opts[1] : opts[0] };
  }
  const ERR = {
    wrong_password: "Kata sandi salah.",
    not_configured: "Server belum diatur. Pastikan GITHUB_TOKEN dan ADMIN_PASSWORD sudah diisi di Vercel.",
    github_read_failed: "Tidak bisa membaca data dari GitHub. Cek token dan nama repo di Vercel.",
    github_write_failed: "GitHub menolak penyimpanan. Cek izin token (Contents: Read and write).",
    github_failed: "Terjadi masalah di GitHub. Coba lagi sebentar lagi.",
    conflict: "GitHub sedang sibuk menyimpan perubahan lain. Perubahanmu masih aman di halaman ini, klik Simpan lagi sebentar lagi.",
    too_large: "Konten atau foto terlalu besar.",
    unsupported_type: "Format foto tidak didukung. Pakai JPG, PNG, WEBP, atau GIF.",
    invalid_content: "Konten tidak valid, perubahan tidak tersimpan."
  };
  const $ = id => document.getElementById(id);
  const mk = (tag, attrs = {}, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === "class") n.className = v;
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
      else if (v === true) n.setAttribute(k, "");
      else if (v !== false && v != null) n.setAttribute(k, v);
    }
    kids.flat().forEach(k => k != null && n.append(k));
    return n;
  };

  let pw = "", draft = null, saved = "", busy = 0;
  const localPrev = new Map();            // /uploads/... path -> data URL, so new photos show before the site redeploys
  try { pw = sessionStorage.getItem("cms-pw") || ""; } catch (e) {}

  async function api(path, body) {
    const r = await fetch(path, {
      method: body ? "POST" : "GET",
      headers: { "x-admin-password": pw, ...(body ? { "Content-Type": "application/json" } : {}) },
      body: body ? JSON.stringify(body) : undefined
    });
    let j = {};
    try { j = await r.json(); } catch (e) {}
    if (!r.ok) throw Object.assign(new Error(j.error || "http_" + r.status), { status: r.status, code: j.error, gh: j.status });
    return j;
  }
  const errText = e => {
    if (e && e.code === "github_write_failed" && (e.gh === 409 || e.gh === 422)) return ERR.conflict;   // a busy moment, not a token problem
    return ERR[e && e.code] || (e && e.status === 404 ? "Fitur CMS belum aktif di server ini."
      : `Gagal (kode ${e && e.status || "jaringan"}). Perubahanmu masih aman di halaman ini, coba klik Simpan lagi.`);
  };

  /* ---------- live preview ---------- */
  const pv = $("pv");
  let pvT;
  const prevDraft = () => JSON.parse(JSON.stringify(draft, (k, v) => (typeof v === "string" && localPrev.has(v) ? localPrev.get(v) : v)));
  function pushPreview() {
    clearTimeout(pvT);
    pvT = setTimeout(() => { if (draft && pv.contentWindow) pv.contentWindow.postMessage({ type: "cms-draft", draft: prevDraft() }, location.origin); }, 120);
  }
  pv.addEventListener("load", pushPreview);

  /* ---------- status and dirty state ---------- */
  const status = (text, kind) => { const s = $("status"); s.textContent = text; s.className = "status" + (kind ? " " + kind : ""); };
  const isDirty = () => draft && JSON.stringify(draft) !== saved;
  /* Every unsaved change is also kept in this browser, so closing the tab, reloading or a phone killing the page
     never loses work: on the next login the editor offers to bring it back. Cleared once a save succeeds. */
  const BACKUP = "cms-draft-backup";
  const backup = () => { try { if (isDirty()) localStorage.setItem(BACKUP, JSON.stringify({ at: Date.now(), base: saved, draft })); else localStorage.removeItem(BACKUP); } catch (e) {} };
  function changed() {
    pushPreview();
    backup();
    $("save").disabled = !isDirty() || busy > 0;
    if (isDirty()) status("Ada perubahan yang belum disimpan.");
    else status("Tidak ada perubahan.");
  }
  window.addEventListener("beforeunload", e => { if (isDirty()) { e.preventDefault(); e.returnValue = ""; } });

  /* ---------- form building blocks ---------- */
  const bilingual = (label, obj, multiline, onEdit) => {
    const field = k => {
      const input = multiline ? mk("textarea", { rows: 4 }) : mk("input", { type: "text" });
      input.value = obj[k] || "";
      input.addEventListener("input", () => { obj[k] = input.value; if (onEdit) onEdit(); changed(); });
      return mk("div", {}, mk("span", { class: "lbl" }, mk("span", { class: "tag" }, k.toUpperCase()), label), input);
    };
    return mk("div", { class: "bi" }, field("en"), field("id"));
  };
  const textField = (label, obj, key, type, hint) => {
    const input = mk("input", { type: type || "text" });
    input.value = obj[key] || "";
    input.addEventListener("input", () => { obj[key] = input.value; changed(); });
    return mk("label", {}, label, input, hint ? mk("span", { class: "hint" }, hint) : null);
  };
  const swatches = (obj, key, onPick) => mk("div", { class: "swatches" }, PALETTE.map(c => {
    const b = mk("button", { type: "button", class: "swatch", style: `background:${c}`, "aria-label": c, "aria-pressed": String(obj[key] === c) });
    b.addEventListener("click", () => {
      obj[key] = c; if (onPick) onPick(); changed();
      b.parentNode.querySelectorAll(".swatch").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    });
    return b;
  }));
  const shown = p => localPrev.get(p) || p;     // what to display for a stored photo value

  /* ---------- photos: shrink in the browser, then upload through the CMS ----------
     Sizes match what the site shows: card photos up to 1200px (full-screen on phones and tablets), the profile photo 320px (shown at 80px) */
  async function shrink(file, maxSide) {
    const bmp = await createImageBitmap(file);
    const scale = Math.min(1, maxSide / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas");
    c.width = Math.max(1, Math.round(bmp.width * scale)); c.height = Math.max(1, Math.round(bmp.height * scale));
    const x = c.getContext("2d");
    x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height);
    x.drawImage(bmp, 0, 0, c.width, c.height);
    return new Promise(r => c.toBlob(r, "image/jpeg", 0.86));
  }
  const readDataUrl = blob => new Promise((res, rej) => { const f = new FileReader(); f.onload = () => res(f.result); f.onerror = rej; f.readAsDataURL(blob); });
  let upQueue = Promise.resolve();
  function uploadPhoto(file, maxSide, onDone) {
    busy++; changed(); status("Mengunggah foto…");   // counted at once, so Simpan waits for the whole queue
    upQueue = upQueue.then(() => uploadOne(file, maxSide, onDone));
  }
  async function uploadOne(file, maxSide, onDone) {
    try {
      if (!/^image\//.test(file.type)) throw Object.assign(new Error("unsupported_type"), { code: "unsupported_type" });
      const blob = await shrink(file, maxSide);
      const dataUrl = await readDataUrl(blob);
      const res = await api("/api/upload", { data: dataUrl.split(",")[1] });
      localPrev.set(res.path, dataUrl);
      onDone(res.path);
      status(busy > 1 ? "Mengunggah foto…" : "Foto terunggah. Klik Simpan supaya dipakai di website.", busy > 1 ? "" : "ok");
    } catch (e) { status(errText(e), "err"); }
    finally { busy--; $("save").disabled = !isDirty() || busy > 0; }
  }
  const filePicker = (multiple, handler) => {
    const input = mk("input", { type: "file", accept: "image/jpeg,image/png,image/webp,image/gif", hidden: true, multiple });
    input.addEventListener("change", () => { const fs = [...input.files]; input.value = ""; fs.forEach(handler); });
    return input;
  };

  function photosEditor(item) {
    const wrap = mk("div", { class: "photos" });
    const draw = () => {
      const picker = filePicker(true, f => uploadPhoto(f, 1200, p => { item.photos = item.photos || []; item.photos.push(p); draw(); changed(); }));
      wrap.replaceChildren(
        ...(item.photos || []).map((p, i) => mk("div", { class: "thumb" },
          mk("img", { src: shown(p), alt: "" }),
          mk("button", { type: "button", "aria-label": "Hapus foto", onclick: () => { item.photos.splice(i, 1); draw(); changed(); } }, "×"))),
        mk("span", {}, mk("button", { type: "button", class: "add-photo", "aria-label": "Tambah foto", onclick: () => picker.click() }, "+"), picker));
    };
    draw();
    return mk("div", { class: "sec", style: "padding:0" }, mk("span", { class: "lbl" }, "Foto polaroid (muncul saat kartu di-hover dan berganti saat di-scroll)"), wrap);
  }
  function cardEditor(list, i, redraw, section) {
    const c = list[i];
    const move = d => { const j = i + d; if (j < 0 || j >= list.length) return; [list[i], list[j]] = [list[j], list[i]]; redraw(); changed(); };
    const iconSel = mk("select", {}, Object.keys(ICON_NAMES).map(k => mk("option", { value: k, selected: c.icon === k }, ICON_NAMES[k])));
    const badge = mk("span", { class: "ibadge", "aria-hidden": "true" });
    const autoBox = mk("input", { type: "checkbox" });
    const sw = swatches(c, "tint", () => { c.auto = false; sync(); });
    const sync = () => {
      badge.style.background = c.tint || "#f1f1f1"; badge.innerHTML = iconSvg(c.icon);
      iconSel.value = c.icon; autoBox.checked = c.auto === true;
      sw.querySelectorAll(".swatch").forEach((s, n) => s.setAttribute("aria-pressed", String(PALETTE[n] === c.tint)));
    };
    const autoRun = () => {
      if (c.auto !== true) return;
      const s = suggest(c, section, list, list.indexOf(c));
      if (s.icon !== c.icon || s.tint !== c.tint) { c.icon = s.icon; c.tint = s.tint; sync(); }
    };
    iconSel.addEventListener("change", () => { c.icon = iconSel.value; c.auto = false; sync(); changed(); });
    autoBox.addEventListener("change", () => { c.auto = autoBox.checked; if (c.auto) autoRun(); sync(); changed(); });
    sync();
    return mk("div", { class: "item" },
      mk("div", { class: "item-head" },
        badge,
        mk("b", {}, (c.title && (c.title.id || c.title.en)) || "Kartu baru"),
        mk("button", { type: "button", class: "btn icon", "aria-label": "Naik", onclick: () => move(-1) }, "↑"),
        mk("button", { type: "button", class: "btn icon", "aria-label": "Turun", onclick: () => move(1) }, "↓"),
        mk("button", { type: "button", class: "btn icon danger", "aria-label": "Hapus kartu", onclick: () => { list.splice(i, 1); redraw(); changed(); } }, "✕")),
      bilingual("Judul", c.title, false, autoRun),
      bilingual("Tempat", c.org, false, autoRun),
      bilingual("Deskripsi", c.desc, true, autoRun),
      mk("div", { class: "row" }, textField("Tahun", c, "year"), mk("label", {}, "Ikon", iconSel)),
      mk("label", { class: "autorow" }, autoBox, mk("span", {}, "Pilih ikon dan warna otomatis dari isi kartu")),
      mk("div", { class: "sec", style: "padding:0" }, mk("span", { class: "lbl" }, "Warna bingkai ikon"), sw),
      photosEditor(c));
  }
  function cardsSection(title, key) {
    const box = mk("div", { class: "sec" });
    const redraw = () => box.replaceChildren(
      ...draft[key].map((_, i) => cardEditor(draft[key], i, redraw, key)),
      mk("button", { type: "button", class: "btn", onclick: () => {
        const nc = { title: { en: "", id: "" }, org: { en: "", id: "" }, desc: { en: "", id: "" }, year: "", icon: "star", tint: "#fde047", photos: [], auto: true };
        draft[key].push(nc);
        const s = suggest(nc, key, draft[key], draft[key].length - 1);
        nc.icon = s.icon; nc.tint = s.tint;
        redraw(); changed();
      } }, "+ Tambah kartu"));
    redraw();
    return mk("details", {}, mk("summary", {}, title), box);
  }
  function chipsSection() {
    const box = mk("div", { class: "sec" });
    const redraw = () => box.replaceChildren(
      mk("span", { class: "lbl" }, "Kiri: English, kanan: Indonesia. Klik titik warna untuk mengganti warna chip."),
      ...draft.chips.map((c, i) => {
        const inp = k => { const x = mk("input", { type: "text", "aria-label": k.toUpperCase() }); x.value = c[k] || ""; x.addEventListener("input", () => { c[k] = x.value; changed(); }); return x; };
        const dot = mk("button", { type: "button", class: "chip-dot", style: `background:${c.color || "#f1f1f1"}`, "aria-label": "Ganti warna", onclick: () => {
          c.color = PALETTE[(PALETTE.indexOf(c.color) + 1) % PALETTE.length]; dot.style.background = c.color; changed();
        } });
        return mk("div", { class: "chip-row" }, inp("en"), inp("id"), dot,
          mk("button", { type: "button", class: "btn icon danger", "aria-label": "Hapus chip", onclick: () => { draft.chips.splice(i, 1); redraw(); changed(); } }, "✕"));
      }),
      mk("button", { type: "button", class: "btn", onclick: () => { draft.chips.push({ en: "", id: "", color: PALETTE[draft.chips.length % PALETTE.length] }); redraw(); changed(); } }, "+ Tambah chip"));
    redraw();
    return mk("details", {}, mk("summary", {}, "Keahlian (chip)"), box);
  }
  function profileSection() {
    const img = mk("img", { src: shown(draft.profilePhoto || ""), alt: "" });
    const picker = filePicker(false, f => uploadPhoto(f, 320, p => { draft.profilePhoto = p; img.src = shown(p); changed(); }));
    return mk("details", { open: true }, mk("summary", {}, "Profil dan judul"),
      mk("div", { class: "sec" },
        mk("div", { class: "profile" }, img, picker, mk("button", { type: "button", class: "btn", onclick: () => picker.click() }, "Ganti foto profil")),
        mk("span", { class: "hint" }, "Pakai foto persegi dengan sedikit ruang di atas kepala supaya tidak terpotong di lingkaran."),
        bilingual("Sapaan", draft.hello),
        bilingual("Judul baris 1", draft.line1),
        bilingual("Kata berwarna", draft.shine),
        bilingual("Judul baris 2 (miring)", draft.line2),
        bilingual("Kalimat di bawah judul", draft.sub, true)));
  }
  function linksSection() {
    const l = draft.links = draft.links || {};
    return mk("details", {}, mk("summary", {}, "Tautan dan email"),
      mk("div", { class: "sec" },
        textField("Instagram (link lengkap)", l, "instagram", "url"),
        textField("LinkedIn (link lengkap)", l, "linkedin", "url"),
        textField("Email", l, "email", "email", "Alamat ini yang tersalin saat tombol email di website diklik.")));
  }

  function buildForm() {
    for (const k of ["hello", "line1", "shine", "line2", "sub"]) draft[k] = draft[k] || { en: "", id: "" };
    draft.edu = draft.edu || []; draft.exp = draft.exp || []; draft.chips = draft.chips || [];
    $("body").replaceChildren(
      mk("p", { class: "note" }, "Setelah klik Simpan, website diperbarui dalam sekitar 1 menit."),
      profileSection(), linksSection(), cardsSection("Pendidikan", "edu"), cardsSection("Pengalaman", "exp"), chipsSection());
  }

  /* ---------- save ---------- */
  async function save() {
    if (busy || !isDirty()) return;
    const btn = $("save");
    btn.disabled = true; status("Menyimpan…");
    try {
      const snapshot = JSON.stringify(draft);
      await api("/api/save", { content: draft });
      saved = snapshot;
      try { localStorage.removeItem(BACKUP); } catch (x) {}
      changed();
      status("Tersimpan. Website diperbarui dalam sekitar 1 menit.", "ok");
    } catch (e) {
      status(errText(e), "err");
      btn.disabled = !isDirty();
    }
  }
  $("save").addEventListener("click", save);
  document.addEventListener("keydown", e => { if ((e.metaKey || e.ctrlKey) && e.key === "s") { e.preventDefault(); save(); } });

  /* ---------- login ---------- */
  async function enter() {
    const data = await api("/api/content");
    draft = data.content; saved = JSON.stringify(draft);
    let restored = false;
    try {
      const b = JSON.parse(localStorage.getItem(BACKUP) || "null");
      if (b && b.draft && JSON.stringify(b.draft) !== saved) {
        const when = new Date(b.at).toLocaleString("id-ID", { dateStyle: "medium", timeStyle: "short" });
        if (window.confirm(`Ada perubahan yang belum tersimpan dari ${when}. Pulihkan sekarang?`)) { draft = b.draft; restored = true; }
        else localStorage.removeItem(BACKUP);
      }
    } catch (e) {}
    $("login").hidden = true; $("app").hidden = false;
    buildForm(); changed();
    status(restored ? "Perubahan sebelumnya dipulihkan. Klik Simpan supaya dipakai di website." : "Tidak ada perubahan.");
  }
  $("login-form").addEventListener("submit", async e => {
    e.preventDefault();
    pw = $("pw").value;
    const b = $("login-btn"), err = $("login-err");
    b.disabled = true; b.textContent = "Memeriksa…"; err.hidden = true;
    try { await enter(); try { sessionStorage.setItem("cms-pw", pw); } catch (x) {} }
    catch (x) { err.textContent = errText(x); err.hidden = false; pw = ""; }
    finally { b.disabled = false; b.textContent = "Masuk"; }
  });
  $("logout").addEventListener("click", () => {
    if (isDirty() && !window.confirm("Ada perubahan yang belum disimpan. Tetap keluar?")) return;
    try { sessionStorage.removeItem("cms-pw"); } catch (e) {}
    location.reload();
  });
  if (pw) enter().catch(() => { pw = ""; try { sessionStorage.removeItem("cms-pw"); } catch (e) {} });
})();
</script>
</body>
</html>
